# FROZEN (2026-09-24). This is the record of `lfm2d-1`, the encoder pod
# that still serves the shell severity head (kube_ordinal_v10) and the
# cascade to the Claude Code advisory hook and kaijutsu's gate.toml. It
# runs image 0.1.4, built from a tree that had those features; this tree
# no longer has --cascade-route, --cascade-severe-label or /v1/cascade, so
# an image built from here will NOT start with these args. Amy: "the old
# lfm2d service will stay frozen indefinitely." Do not bump its image;
# the System 1 service is k8s-zorak-system1.yaml.
#
# lfm2d — zorak-pinned overlay of k8s.yaml for the tobert.org homelab
# k3s cluster (brak = control plane, zorak = tainted agent node).
# Node facts verified live by the zorak Claude session, 2026-08-10:
# labels role=execution, gpu.vendor=amd, gpu.arch=gfx1151; taint
# homelab.tobert.org/execution=true:NoSchedule (deliberate — zorak
# reboots; brak-destined pods must not drift onto it).
#
# Differences from the generic k8s.yaml, all deliberate:
#   * pinned to zorak via nodeSelector + toleration — nothing schedules
#     onto a tainted node without the toleration, and nothing else has
#     the model files;
#   * models come from a hostPath under /tank — brak's local-path
#     provisioner is node-local to BRAK, so a PVC does not compose with
#     a zorak-pinned pod; hostPath is honest about node-pinned state;
#   * OTLP points at the in-cluster collector brak's session stood up
#     on deploy day (monitoring/otel-collector). The earlier HOST_IP
#     downward-API workaround to zorak's host collector is RETIRED —
#     traces have a cluster home now.
#   * replicas: 1 — replica-scaling is the right lever generally (see
#     k8s.yaml), but pinned to one node the replicas would fight over
#     the same cores; revisit when a second gfx-labeled node exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfm2d
  namespace: lfm2d   # Amy's pick, 2026-08-10; needs hostPath allowed (no
                     # restricted/baseline PSA) — brak's session creates it
  labels:
    app: lfm2d
spec:
  replicas: 1
  selector:
    matchLabels: { app: lfm2d }
  template:
    metadata:
      labels: { app: lfm2d }
    spec:
      nodeSelector:
        gpu.arch: gfx1151
      tolerations:
        - key: "homelab.tobert.org/execution"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 30
      containers:
        - name: lfm2d
          # brak's LAN gitea registry (plain HTTP, LAN-only by design;
          # zorak's /etc/rancher/k3s/registries.yaml carries the mirror
          # entry, so no imagePullSecret is needed — anonymous pull is
          # allowed and was verified end-to-end 2026-08-11).
          #
          # This replaces `ghcr.io/tobert/lfm2d:latest`, which was never
          # actually published: that push was blocked on a missing
          # `write:packages` scope and a `k3s ctr images import` tarball
          # was used instead. The cluster was therefore running an image
          # that existed ONLY in zorak's containerd, under a name pointing
          # at a registry that would refuse to serve it. Nothing was wrong
          # while the node kept the image, but a reschedule after an image
          # GC — or a zorak rebuild — would have surfaced as ErrImagePull
          # and read as a registry problem rather than a never-published
          # image. GHCR returns "denied" for private AND nonexistent repos
          # by design, so the error would have sent someone hunting for an
          # imagePullSecret that could not exist.
          #
          # A real version, never `:latest`. `:latest` + IfNotPresent is
          # exactly how the situation above went unnoticed for a day.
          #
          # Running imageID digest for 0.1.4, read back off the pod:
          #   sha256:59a22d6c6c725f7bde9dbb25757e9cd9d3dc2fe3e6c46e7ff7ae041edefb1672
          # (0.1.3 was sha256:2805f1d9…; 0.1.2 sha256:e9c494f4…; 0.1.1
          # sha256:de4c3418…; 0.1.0 sha256:9259e4c0… — rollback targets, all
          # still in the registry.)
          #
          # 0.1.4 (2026-09-12) is a CPU build of 644c6d7: W3C traceparent/
          # tracestate propagation, lfm2d.execution.* resource attributes,
          # and --device (default auto; this image compiles no GPU backend,
          # so auto logs the reason and selects cpu). No args or memory
          # change. Before/after probe on classify/cascade/spans/route:
          # classify and cascade severity scores byte-identical; router
          # cosines and one PII span score moved in the 7th significant
          # digit (candle moved from crates.io 0.11 to the tobert/candle pin).
          # Bump this comment WITH the tag — a digest recorded next to a
          # different version is worse than no digest, because it reads as
          # verified. It went stale within one deploy of being written.
          #
          # Take the digest from the POD, never from `podman inspect`: the
          # local 0.1.2 manifest digest reads sha256:eede5b27… while the
          # cluster reported sha256:e9c494f4… for the same tag. The pod is
          # what is actually running.
          #
          # 0.1.3 (2026-09-05) is a CATCH-UP release: the running 0.1.2 was
          # built at 28d927a on 2026-08-11 and five daemon commits landed
          # after it. No args change, no memory change, no new behavior
          # unless a flag is added. What it brings:
          #   * the resolved cascade severity ranking is echoed at startup,
          #     so the ORDER-IS-SEMANTIC note below is verifiable in the log
          #     rather than by reading this file;
          #   * duration metric names lose their doubled unit suffix —
          #     lfm2d_*_duration_ms_milliseconds_* becomes
          #     lfm2d_*_duration_milliseconds_*. BREAKING for queries, and
          #     taken now because it is still free: checked live in
          #     VictoriaMetrics on deploy day, 8 lfm2d series, zero alert or
          #     recording rules, no Grafana in the cluster;
          #   * --dtype (f32 default / f16 / bf16), refusing to start on a
          #     dtype it cannot compute in — a memory lever, unused here;
          #   * --candidate-classifier-dir, which scores a SECOND classifier
          #     shadow-only on every /v1/classify and /v1/cascade and never
          #     changes a response byte. Deliberately NOT set below: it is a
          #     4th resident trunk (~+1.4 GiB, so the 6Gi request would need
          #     to grow) and it roughly doubles classify work on the one
          #     serial worker, which the burst behaviour cannot absorb
          #     today. Turn it on the day a v10.1 candidate exists, and bump
          #     the memory request in the same edit.
          image: 192.168.1.2:3000/amy/lfm2d:0.1.4
          imagePullPolicy: IfNotPresent
          args:
            # kube_ordinal_v9 — Amy's straight-cutover call 2026-08-16:
            # "we should deploy v9 or get on v10 and deploy it, it's still
            # too early to judge against prior models." v8 AND v6 both
            # remain staged alongside on /tank as rollback targets; roll
            # back by pointing this one line at kube_ordinal_v8 and
            # restarting (no image change — the heads are hostPath data,
            # not baked into the image).
            #
            # PRIOR-CALIBRATED (tau=0.5), same day. The raw v9 fired
            # data-critical 4.1x as often as v8 on identical inputs (21.7% vs
            # 5.3% over the same 851 real commands) while RANKING better
            # (14/23 vs 5/23 delta-margin) -- ranking well and thresholding
            # badly is what a learned class prior looks like, and v9's
            # training mix is 52.6% data-critical.
            #
            # The correction is a per-class constant in logit space
            # (b' = b - tau*log(prior)), so it is NOT serving code -- it is
            # literally a different bias vector. Exactly 1 of 150 tensors
            # differs from kube_ordinal_v9; the trunk is byte-identical.
            # Built by training/v9/severity_probes/calibrate_prior.py.
            #
            #                severe probes  benign controls  firing  gate
            #   v8               34/55           0/7          5.3%   5/23
            #   v9 raw           44/55           2/7         21.0%  14/23
            #   v9_cal tau=0.5   43/55           0/7          4.0%  14/23
            #
            # tau=0.5 was chosen by MATCHING v8's firing rate, which is a
            # familiar anchor and not a principled one. Amy: "let's keep a
            # note to revisit t" -- the open question, what it needs, and the
            # specifics (tau=1.0 gates 15/23; tau=0.5 loses the raw-device
            # `dd` probe) live in training/v9/PLAN.md "Open questions".
            # Re-tuning tau needs NO retraining -- re-run calibrate_prior.py.
            #
            # weight_hash e57ea1da5067d17edafdd01c5e1dfcccbc1eed3e5bbfc5ed2cb3649472979555
            # (raw v9    f2b2ac2b8b037759717522511db93c92b888ee00677c067b73819af28a0d34d7)
            # (v8        65c450b0c06cf00738cbaecbaea71499c1bca7997ded543c66caf09e33db0fba)
            #
            # Switching checkpoints is NOT one line IN GENERAL: v6 spoke a
            # different label vocabulary (informative/mutating/destructive)
            # than v8/v9 (informative/situation-normal/data-critical), so
            # for THAT move the severe set must travel with it. It does not
            # apply to v8→v9: both were verified to carry the identical
            # vocabulary AND order before this change (v8 read live off
            # /v1/models, v9 read off its config.json), so the severe pair
            # below is unchanged and still correct. Mismatched labels do
            # not degrade silently anyway: `cascade::resolve_severe_labels`
            # refuses an unknown label and names it, so /v1/cascade would
            # error on every call rather than serve a wrong ranking.
            #
            # KNOWN, ACCEPTED: v9 is a genuinely different model, not a
            # refinement of v8 — 32.9% verdict agreement replaying the
            # advisory log, and in local shadow it gained the in-place-edit
            # form (sed -i, python read-replace-write) while losing some
            # read-only discrimination.
            #
            # The "expect it noisier on reads" warning that stood here for a
            # few hours is RETIRED by the calibration above: the two benign
            # controls that made raw v9 noisy (`cat README.md`, `cargo build`)
            # both stop firing at tau=0.5, and real-traffic firing drops
            # 21.0% -> 4.0%. Left as a note rather than deleted because the
            # underlying fact still holds — this is a different model, and
            # calibration moved the threshold, not the representation.
            - --classifier-dir=/models/kube_ordinal_v10
            - --router-dir=/models/LFM2.5-Encoder-350M-Prompt-Router
            # Token-classification head backing /v1/spans and
            # /v1/spans/credentials. A THIRD resident trunk: heads only
            # share a trunk when trained on a common frozen one, and this
            # is a LiquidAI-shipped specialist — measured, it shares 0 of
            # 148 trunk tensors with the base encoder, and our finetuned
            # classifier diverges from both. So this is ~1.4 GiB of its
            # own, not a marginal cost. The flag is repeatable; a second
            # head here would make the request field mandatory.
            - --token-classifier-dir=/models/LFM2.5-Encoder-350M-PII-Detector
            - --cascade-route=shell
            - --cascade-route=k8s
            # ORDER IS SEMANTIC: ascending severity, least severe first.
            # As of 2026-08-11 the cascade ranks by expected ordinal rank,
            # so the Nth severe label here weighs N. Reversing these two
            # lines inverts the ranking, and no error will be raised —
            # the label names are both valid, only their order is wrong.
            # Verify against /v1/cascade output, where a clearly destructive
            # clause must score near the top of the 0..2 range.
            - --cascade-severe-label=situation-normal
            - --cascade-severe-label=data-critical
            - --bind-addr=0.0.0.0:8088
            # MEASURED on zorak 2026-09-05 with the shipped 0.1.3 image, the
            # live head + Prompt-Router, and the 5-clause cascade the advisory
            # hook actually sends. Interleaved 8/32/8/32 runs to cancel drift
            # on a box that was busy with llama-bench at load ~10:
            #
            #   threads   p50 ms          cpu-sec per cascade   effective cores
            #   32        858 831 867     10.15 10.11 10.38     ~12
            #   16        700              5.76                 ~8
            #   8         728 756 798      3.33  3.48  3.67     ~4.5
            #   4         919              2.75                 ~2.9
            #
            # The default is std::thread::available_parallelism() = 32 here,
            # and 32 is worse on BOTH axes: ~15% SLOWER than 8 while burning
            # 3x the CPU for the same answer. This is not a latency-for-CPU
            # trade, it is over-parallelization — the per-clause matmuls are
            # small enough that rayon's coordination costs more than the extra
            # width wins, and on a contended box the wide pass cannot get its
            # cores anyway. 4 threads is where it finally does turn into a
            # trade (919 ms), so 8 is the floor of the flat region, not a
            # random pick.
            #
            # Effect on the pod: ~12 cores per request burst -> ~4.5, and at
            # the measured ~5.7 inference ops/min that is ~1.1 cores steady
            # -> ~0.37. Idle is 0.000 cores either way (verified: all 70
            # threads sleeping across five samples; nothing busy-waits).
            #
            # This does NOT fix the advisory breaker under burst. One serial
            # inference worker means throughput is 1/latency — ~1.2 req/s at
            # 32 threads, ~1.4 at 8 — while the 2026-09-03 fan-out drove 3.25
            # req/s. It buys ~18% headroom, not a solution; rate limiting on
            # the caller side is still the answer there.
            - --threads=8
          ports:
            - containerPort: 8088
          env:
            # In-cluster collector, stood up by brak's session 2026-08-10
            # (monitoring/otel-collector, gRPC 4317 + HTTP 4318) — this
            # RETIRES the HOST_IP downward-API workaround that previously
            # lived here; brak had already made this exact change live
            # before our Service update briefly reverted it.
            #
            # That collector is GONE (replaced ~2026-09-07). Its name kept
            # resolving nowhere and every export failed DNS for ~5 days,
            # 0.1.3 and 0.1.4 alike, with nothing but pod-log ERRORs to show.
            # The stack is now a hostNetwork otel-agent DaemonSet whose
            # receiver binds node LOOPBACK only (pods cannot reach it) and
            # which injects the ingest key before forwarding to the ClickStack
            # gateway. Amy's ruling 2026-09-12: pods go straight to the
            # gateway with a copy of the key in this namespace.
            #
            # The Secret is created out of band, never from this file:
            #   kubectl -n clickstack get secret clickstack-secret \
            #     -o jsonpath='{.data.HYPERDX_API_KEY}' | base64 -d \
            #   | kubectl -n lfm2d create secret generic lfm2d-otlp \
            #     --from-file=HYPERDX_API_KEY=/dev/stdin
            # It is a COPY: rotating clickstack-secret means re-running that.
            # Raw key, no "Bearer " prefix, same as the agent sends.
            # HYPERDX_API_KEY must stay ABOVE the headers var — $(VAR)
            # expansion only sees earlier entries, and a miss is left as the
            # literal text, which would authenticate as nothing, silently.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://clickstack-otel-collector.clickstack.svc.cluster.local:4317"
            - name: HYPERDX_API_KEY
              valueFrom:
                secretKeyRef: { name: lfm2d-otlp, key: HYPERDX_API_KEY }
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "authorization=$(HYPERDX_API_KEY)"
            - name: OTEL_SERVICE_NAME
              value: lfm2d
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: 8088 }
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: 8088 }
            periodSeconds: 10
            failureThreshold: 3
          # /tank is local NVMe-class storage — load is the ~400-660ms/
          # head local-disk case, but the generous budget costs nothing.
          startupProbe:
            httpGet: { path: /readyz, port: 8088 }
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              # MEASURED with all three heads resident, read from
              # /proc/1/status in the running pod 2026-08-11:
              #   VmRSS  4256096 kB = 4.06 GiB   steady
              #   VmHWM  5620188 kB = 5.36 GiB   peak during checkpoint load
              # (Two heads were 2.78 / 4.03 GiB, so the third trunk cost
              # ~1.3 GiB steady — consistent with ~1.4 GiB/head.)
              # 6Gi covers the load peak with modest headroom.
              #
              # Deliberately request-only, NO memory limit: the peak is a
              # transient during checkpoint load, and a limit sized for
              # steady state would OOMKill the pod while it starts.
              #
              # Trivial on zorak (125 GiB), but the kubelet's free-memory
              # arithmetic there is OPTIMISTIC: host-level llama.cpp
              # servers outside k8s can claim 70+ GiB and
              # system-reserved isn't set yet (zorak session's
              # issues.md) — keep honest requests anyway.
              memory: "6Gi"
              cpu: "4"
      volumes:
        - name: models
          hostPath:
            # One subdirectory per checkpoint (config.json +
            # model.safetensors + tokenizer.json), rsync-delivered; the
            # zorak session owns this tree.
            path: /tank/ml/models/lfm2d
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: lfm2d
  namespace: lfm2d
  annotations:
    # Stable tailnet hostname (otherwise the operator derives one from
    # namespace+service): lfm2d.<tailnet>.ts.net via MagicDNS.
    tailscale.com/hostname: "lfm2d"
spec:
  selector: { app: lfm2d }
  ports:
    - port: 8088
      targetPort: 8088
  # Tailscale operator (installed by brak 2026-08-10): lfm2d gets its
  # own tagged tailnet identity — no 0.0.0.0 listener, ACL-targetable.
  # First deploy ran ClusterIP-only until health + weight_hash were
  # verified in-cluster (they were: f740471a… exact match).
  type: LoadBalancer
  loadBalancerClass: tailscale
  # Deliberately ClusterIP (no `type:`) for first deploy: prove the pod
  # healthy and the weight_hash correct from inside the cluster, THEN
  # decide exposure. lfm2d has no auth of its own, and the zorak session
  # audit (2026-08-10) found two things that make exposure a conscious
  # decision, not a default:
  #   1. k3s ServiceLB/NodePort binds 0.0.0.0 — putting `tailscale
  #      serve` in front adds a TLS tailnet path but does NOT close the
  #      LAN listener next to it; "tailnet boundary" via ServiceLB is
  #      decoration unless the port is also firewalled off the LAN NIC.
  #   2. The tailnet has a SECOND user account on it — tailnet-only is
  #      not owner-only for an unauthenticated API.
  # The clean answer stays the Tailscale k8s operator (brak's call):
  #   type: LoadBalancer
  #   loadBalancerClass: tailscale
  # gives lfm2d its own tagged tailnet identity with no 0.0.0.0
  # listener, and tags make it ACL-targetable so access can be
  # restricted per-user. Funnel (public internet) is ruled out.
